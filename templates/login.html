{% extends 'base.html' %}

{% block content %}
<div class="auth-wrap page">
    <div class="auth-card auth-card--standalone">
        <div class="auth-brand-logo">
            <img src="{{ url_for('static', filename='he.png') }}" alt="Logo"
                style="width: 100%; height: 100%; object-fit: contain; border-radius: 12px;">
        </div>
        <div style="text-align: center; margin-bottom: 24px;">
            <div class="auth-title">Welcome Back</div>
            <div class="auth-sub">Authenticate to access Anik X Cheats Client Area</div>
        </div>

        <form method="POST" class="auth-form">
            <div class="field">
                <label class="form-label">Username</label>
                <input type="text" name="username" placeholder="Enter username" required autocomplete="off"
                    class="form-input">
            </div>
            <div class="field">
                <label class="form-label">Password</label>
                <input type="password" name="password" placeholder="••••••••" required class="form-input">
            </div>
            <button type="submit" class="btn-full" style="margin-top: 10px;">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
