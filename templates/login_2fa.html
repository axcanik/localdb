{% extends 'base.html' %}

{% block content %}
<div class="auth-wrap page">
    <div class="auth-card auth-card--standalone" style="max-width: 440px;">
        <div class="auth-brand-logo" style="animation: pulseGlow 2s infinite;">
            <img src="{{ url_for('static', filename='he.png') }}" alt="Logo"
                style="width: 100%; height: 100%; object-fit: contain; border-radius: 12px;">
        </div>
        <div style="text-align: center; margin-bottom: 24px;">
            <div class="auth-title" style="font-size: 22px; text-shadow: 0 0 10px rgba(251, 191, 36, 0.4);">2FA
                Verification</div>
            <div class="auth-sub" style="font-size: 13px;">Enter the 6-digit code from your Google Authenticator app to
                proceed.</div>
        </div>

        <form method="POST" class="auth-form">
            <div class="field">
                <label class="form-label"
                    style="text-align: center; display: block; margin-bottom: 12px; letter-spacing: 2px;">Verification
                    Code</label>
                <input type="text" name="otp_code" placeholder="e.g. 123456" required autocomplete="off" autofocus
                    class="form-input" maxlength="6" pattern="\d{6}" inputmode="numeric"
                    style="text-align: center; font-size: 24px; letter-spacing: 8px; font-family: var(--font-mono); color: var(--r4); font-weight: 700;">
            </div>

            <button type="submit" class="btn-full" style="margin-top: 15px;">Verify & Access</button>

            <div style="text-align: center; margin-top: 20px;">
                <a href="{{ url_for('logout') }}"
                    style="color: var(--tx3); text-decoration: none; font-size: 12px; font-weight: 700; transition: color 0.2s;"
                    onmouseover="this.style.color='var(--r4)'" onmouseout="this.style.color='var(--tx3)'">
                    ← Back to Sign In
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
